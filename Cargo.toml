[package]
name = "bdk_sqlx"
version = "0.0.1"
edition = "2021"

[dependencies]
bdk_wallet = { version = "1.2.0", features = ["test-utils"] }
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.125"
sqlx = { version = "0.8.5", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "derive", "postgres", "sqlite", "json", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1.44.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "serde_json", "json"] }

[dev-dependencies]
assert_matches = "1.5.0"
anyhow = "1.0.98"
bdk_electrum = { version = "0.21.0"}
rustls = "0.23.14"

[[example]]
name = "bdk_sqlx_postgres"
path = "examples/bdk_sqlx_postgres.rs"
